name: iOS Integrity & Build Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Test Core Engine & App Bundle
        run: |
          npx tsc
          node $(find dist -name "index.js" | head -n 1)

      - name: Export iOS Bundle via Expo
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Upload iOS Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-bundle
          path: dist-ios/
