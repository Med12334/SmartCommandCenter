name: iOS Integrity & Build Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Test Core Engine & App Bundle
        run: |
          npx tsc
          node $(find dist -name "index.js" | head -n 1)

      - name: Export React Native iOS Bundle
        run: |
          mkdir -p ios-bundle
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file src/App.tsx \
            --bundle-output ios-bundle/main.jsbundle \
            --assets-dest ios-bundle

      - name: Upload iOS Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-bundle
          path: ios-bundle/
