name: iOS Integrity & Build Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Test Core Engine & App Bundle
        run: |
          npx tsc
          # Finds and executes index.js regardless of output path (dist/index.js or dist/src/index.js)
          node $(find dist -name "index.js" | head -n 1)
